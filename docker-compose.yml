version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    container_name: deepshield-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./database:/app/database
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///database/forensic.db
    depends_on:
      - redis
    networks:
      - deepshield-network

  redis:
    image: redis:7-alpine
    container_name: deepshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - deepshield-network

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: deepshield-celery
    restart: unless-stopped
    command: celery -A backend.app.celery worker --loglevel=info
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./database:/app/database
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///database/forensic.db
    depends_on:
      - redis
    networks:
      - deepshield-network

  nginx:
    image: nginx:alpine
    container_name: deepshield-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    networks:
      - deepshield-network

networks:
  deepshield-network:
    driver: bridge

volumes:
  redis-data: